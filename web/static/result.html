<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 4px 8px 28px; font-family: "Source Sans Pro", "Segoe UI", system-ui, sans-serif; background: transparent; color: #0f2a4a; }
  .card { display: flex; gap: 30px; align-items: center; padding: 20px 26px; border-radius: 20px; background: #fff;
          border: 1px solid var(--line); box-shadow: 0 12px 30px var(--glow);
          background-image: linear-gradient(120deg, var(--tint) 0%, #ffffff 65%);
          opacity: 0; transform: translateY(10px) scale(.98); transition: opacity .45s, transform .45s; }
  .card.show { opacity: 1; transform: none; }
  svg { flex: none; }
  .info { flex: 1; min-width: 0; }
  .verdict { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; color: var(--c); margin: 0 0 4px; }
  .badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff;
           background: var(--c); font-size: 18px; animation: pop .5s .3s both; }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } }
  .line { margin: 4px 0; color: #64748b; font-size: 15px; }
  .line b { color: #0f2a4a; }
  .scale { position: relative; height: 10px; margin: 14px 0 6px; border-radius: 99px;
           background: linear-gradient(90deg, #4ade80 0%, #facc15 50%, #f87171 100%); }
  .marker { position: absolute; top: -5px; left: 0; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
            background: #fff; border: 4px solid var(--c); box-shadow: 0 2px 8px rgba(15, 42, 74, .2); transition: left 1s cubic-bezier(.2,.8,.2,1); }
  .ticks { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="card" id="card">
  <svg width="180" height="112" viewBox="0 0 200 120" aria-hidden="true">
    <path d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="#eef2f7" stroke-width="16" stroke-linecap="round"/>
    <path id="arc" d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="var(--c)" stroke-width="16"
          stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
    <text id="pct" x="100" y="98" text-anchor="middle" font-size="32" font-weight="700" fill="#0f2a4a">0%</text>
    <text x="100" y="117" text-anchor="middle" font-size="11" fill="#94a3b8">xác suất giả mạo</text>
  </svg>
  <div class="info">
    <p class="verdict"><span class="badge" id="badge"></span><span id="verdict"></span></p>
    <p class="line">Xác suất giả mạo: <b id="prob"></b> · ngưỡng quyết định 50%</p>
    <div class="scale"><span class="marker" id="marker"></span></div>
    <div class="ticks"><span>An toàn</span><span>Nghi ngờ</span><span>Giả mạo</span></div>
    <p class="line" id="truth"></p>
  </div>
</div>
<script>
  const data = __DATA__;
  const phishing = data.prob >= 0.5;
  const theme = phishing
    ? { c: "#ef4444", tint: "#fef2f2", line: "#fecaca", glow: "rgba(239,68,68,.14)" }
    : { c: "#10b981", tint: "#ecfdf5", line: "#bbf7d0", glow: "rgba(16,185,129,.14)" };
  const card = document.getElementById("card");
  for (const [k, v] of Object.entries(theme)) card.style.setProperty("--" + k, v);
  document.getElementById("badge").textContent = phishing ? "!" : "✓";
  document.getElementById("verdict").textContent = phishing ? "Website GIẢ MẠO" : "Website HỢP LỆ";
  document.getElementById("prob").textContent = (data.prob * 100).toFixed(1) + "%";
  if (data.truth !== null) {
    const right = (data.truth === 1) === phishing;
    document.getElementById("truth").innerHTML =
      `Nhãn thật: <b>${data.truth === 1 ? "giả mạo" : "hợp lệ"}</b> ` +
      `<span class="tag" style="background:${right ? "#dcfce7" : "#fee2e2"};color:${right ? "#047857" : "#b91c1c"}">` +
      `${right ? "✓ Dự đoán đúng" : "✗ Dự đoán sai"}</span>`;
  }
  requestAnimationFrame(() => {
    card.classList.add("show");
    document.getElementById("marker").style.left = (data.prob * 100) + "%";
  });
  const arc = document.getElementById("arc"), pct = document.getElementById("pct");
  const target = data.prob * 100, t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / 900), v = target * (1 - Math.pow(1 - k, 3));
    arc.setAttribute("stroke-dasharray", `${v} 100`);
    pct.textContent = Math.round(v) + "%";
    if (k < 1) requestAnimationFrame(step);
  })(t0);
</script>
</body>
</html>
